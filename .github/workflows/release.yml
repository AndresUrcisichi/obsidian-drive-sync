name: Release Obsidian plugin

on:
    push:
        tags:
            - "*"

permissions:
    contents: write

jobs:
    build:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v4

            - name: Use Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "22.x"
                  cache: npm

            - name: Test and build
              env:
                  # Public values only. The client secret is never baked into a
                  # public release; each device stores it in secret storage.
                  GDVS_CLIENT_ID: ${{ vars.GDVS_CLIENT_ID }}
                  GDVS_REDIRECT_URI: ${{ vars.GDVS_REDIRECT_URI }}
              run: |
                  npm ci
                  npm test
                  npm run build

            - name: Create release
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  tag="${GITHUB_REF#refs/tags/}"
                  gh release create "$tag" \
                    --title="$tag" \
                    main.js manifest.json styles.css
